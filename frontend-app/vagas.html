<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vagas | TalentoSaaS</title>
 <link rel="stylesheet" href="css/vagas.css">
</head>

<body>
  <header>
    <h1>TalentoSaaS</h1>
    <p>Encontre sua próxima oportunidade profissional.</p>
    <nav>
      <a href="vagas.html">Vagas disponíveis</a>
      <a href="admin/">Área administrativa</a>
    </nav>
  </header>

  <main>
    <section>
      <h2>Vagas disponíveis</h2>
      <p>Escolha uma oportunidade e envie seu currículo.</p>
      
      <div id="vagas-dinamicas"></div>

     
    </section>

    <section id="candidatura">
      <h2>Enviar candidatura</h2>

      <form id="form-candidatura">
        <label for="nome">Nome completo</label>
        <input id="nome" type="text" required>

        <label for="email">E-mail</label>
        <input id="email" type="email" required>

        <label for="vaga">Vaga selecionada</label>
        <input id="vaga" type="text" readonly required>

       <label for="curriculo">Currículo (escreva abaixo ou anexe um arquivo)</label>
       <textarea id="curriculo" rows="8" minlength="30"
  placeholder="Descreva sua formação, experiências e habilidades (mínimo de 30 caracteres)..."></textarea>

        <label for="arquivo">Anexar currículo (PDF ou TXT)</label>
        <input id="arquivo" type="file" accept=".pdf,.txt">

        <button type="submit">Enviar candidatura</button>
      </form>

      <p id="mensagem"></p>
    </section>
  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  
  <script>

const SUPABASE_URL = 'https://klegkygqsqjlgutqygzq.supabase.co';

const SUPABASE_KEY = 'sb_publishable_kErxiHSwPpdwV_W704DlpA_KXLx88Eh';

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);
    
    function selecionarVaga(nome) {
      document.getElementById('vaga').value = nome;
      document.getElementById('candidatura').scrollIntoView({
        behavior: 'smooth'
      });
    }

    
document.getElementById('form-candidatura')
  .addEventListener('submit', async function(evento) {
    evento.preventDefault();

    const mensagem = document.getElementById('mensagem');
    const formulario = document.getElementById('form-candidatura');
    const botao = formulario.querySelector('button[type="submit"]');

    const curriculo = document.getElementById('curriculo').value.trim();
    const arquivo = document.getElementById('arquivo').files[0];

    if (arquivo) {
      mensagem.textContent =
        'Por enquanto, envie seu currículo pelo campo de texto.';
      return;
    }

    if (curriculo.length < 30) {
      mensagem.textContent =
        'O currículo deve ter pelo menos 30 caracteres.';
      return;
    }

    const candidatura = {
      nome: document.getElementById('nome').value.trim(),
      email: document.getElementById('email').value.trim(),
      vaga: document.getElementById('vaga').value.trim(),
      curriculo: curriculo
    };

    botao.disabled = true;
    mensagem.textContent = 'Enviando candidatura...';

    try {
      const { error } = await supabaseClient
        .from('candidaturas')
        .insert([candidatura]);

      if (error) throw error;

      mensagem.textContent =
        'Candidatura registrada com sucesso!';

      formulario.reset();
    } catch (erro) {
      console.error('Erro ao cadastrar candidatura:', erro);
      mensagem.textContent =
        'Não foi possível enviar a candidatura. Tente novamente.';
    } finally {
      botao.disabled = false;
    }
  });


    

async function carregarVagasDinamicas() {
  const lista = document.getElementById('vagas-dinamicas');

  lista.textContent = 'Carregando vagas disponíveis...';

  const { data: vagas, error } = await supabaseClient
    .from('vagas')
    .select('id, titulo, descricao, requisitos, salario, regime_contratacao')
    .eq('ativa', true)
    .order('criado_em', { ascending: false });

  if (error) {
    console.error('Erro ao carregar vagas:', error);
    lista.textContent = 'Não foi possível carregar as vagas.';
    return;
  }

  lista.replaceChildren();

  if (!vagas || vagas.length === 0) {
    lista.textContent = 'Nenhuma vaga disponível no momento.';
    return;
  }

  const moeda = valor =>
    Number(valor).toLocaleString('pt-BR', {
      style: 'currency',
      currency: 'BRL'
    });

  vagas.forEach(vaga => {
    const artigo = document.createElement('article');

    const titulo = document.createElement('h3');
    titulo.textContent = vaga.titulo;

    const descricao = document.createElement('p');
    descricao.textContent = vaga.descricao || '';

    const requisitos = document.createElement('p');
    requisitos.textContent =
      'Conhecimentos: ' + (vaga.requisitos || 'Não informados');

    const salario = document.createElement('p');
    salario.textContent = vaga.salario != null
      ? 'Salário bruto: ' + moeda(vaga.salario)
      : 'Salário a combinar';

    const regime = document.createElement('p');
    regime.textContent =
      'Contratação: ' + (vaga.regime_contratacao || 'Não informada');

    const botao = document.createElement('button');
    botao.type = 'button';
    botao.textContent = 'Candidatar-se';

    botao.addEventListener('click', () => {
      selecionarVaga(vaga.titulo);
    });

    artigo.append(
      titulo,
      descricao,
      requisitos,
      salario,
      regime,
      botao
    );

    lista.appendChild(artigo);
  });
}

carregarVagasDinamicas();


  </script>
</body>
</html>
